<section class="form-area">
  <h2 class="form-area__title">
    Заповніть форму для консультації або запису на діагностику/ремонт
  </h2>
  <form
    action="https://a038db3388774a076d9eg1paq1hyyyyyb.oast.pro"
    method="POST"
    class="form"
  >
    <fieldset>
      <legend><span>Введіть, будь ласка, ваші контактні дані</span></legend>

      <div class="form-group">
        <label for="name">Ваше ім’я <span>*</span></label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Введіть ваше ім’я"
          required
        />
        <span class="form-error" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="phone">Телефон <span>*</span></label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="ваш контактний номер телефону"
          required
          pattern="\d*"
        />
        <span class="form-error" id="phoneError"></span>
      </div>

      <div class="form-group">
        <div class="custom-select-wrapper">
          <label for="city">Місто <span>*</span></label>
          <select name="city" id="city" class="custom-select" required>
            <option value="" disabled selected>Оберіть місто зі списку</option>
            <option value="kyiv">Київ</option>
            <option value="kharkiv">Харків</option>
            <option value="odesa">Одеса</option>
            <option value="lutck">Луцьк</option>
            <option value="lviv">Львів</option>
            <option value="dnipro">Дніпро</option>
            <option value="kryvii-rih">Кривий Ріг</option>
          </select>
          <span class="form-error" id="cityError"></span>
          <img
            src="../images/icons/select-arrow_icon.svg"
            alt="dropdown-arrow"
            class="custom-arrow"
          />
        </div>
      </div>

      <button type="submit" class="form-submit">
        Замовити телефонний дзвінок
      </button>
    </fieldset>
  </form>

  <div id="successModal" class="modal">
    <div class="modal-content">
      <span class="close">
        <img src="../images/icons/close-icon.svg" alt="close" />
      </span>
      <img
        class="modal-success-icon"
        src="../images/icons/popup-success.svg"
        alt="success"
      />
      <p class="modal-title">
        Дякуємо вам за заявку! Найближчим часом наш консультант зв’яжеться з
        вами
      </p>
      <span class="modal-desc">
        Будьте в курсі останніх новин компанії, підписуйтесь на нас в соціальних
        мережах
      </span>
      <div class="modal-socials">
        <div class="modal-social__item">
          <a href="#">
            <img src="../images/icons/facebook-icon.svg" alt="facebook" />
          </a>
        </div>
        <div class="modal-social__item">
          <a href="#">
            <img src="../images/icons/instagram-icon.svg" alt="instagram" />
          </a>
        </div>
        <div class="modal-social__item">
          <a href="#">
            <img src="../images/icons/youtube-icon.svg" alt="youtube" />
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
